[package]
name = "allchats"
version = "1.0.2"
edition = "2021"
build = "build.rs"

[dependencies]
tao = "0.31"
wry = "0.50"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
ureq = "2"
image = { version = "0.25", default-features = false, features = ["ico", "png"] }
open = "5"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Graphics_Dwm", "Win32_System_Threading"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
