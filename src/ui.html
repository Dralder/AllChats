<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
/*__FONTS__*/
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
body { --f: 'AC-EN', Consolas, "Segoe UI", monospace; height: 100%; background: #202020; color: #E0E0E0; font-size: 13px; font-family: var(--f); overflow: hidden; }
body.fa { --f: 'AC-FA', Tahoma, "Segoe UI", sans-serif; }
html { height: 100%; background: #202020; color: #E0E0E0; overflow: hidden; }
#bar { height: 32px; display: flex; align-items: center; background: #202020; color: #8A8A8A; font-size: 12px; direction: ltr; }
#drag { flex: 1; height: 32px; line-height: 32px; padding-left: 12px; }
#bar button { width: 44px; height: 32px; border: 0; border-radius: 0; background: transparent; color: #E0E0E0; font-size: 13px; font-family: var(--f); cursor: pointer; }
#bar button:hover { background: #2A2A2D; }
#bar button#close:hover { background: #D04040; }
#bar button.lg { width:62px; height:22px; margin-right:4px; border-radius:5px; font-size:11px; background:#2A2A2D; color:#8A8A8A; font-family: Tahoma, "Segoe UI", sans-serif; }
#bar button.lg:hover { background:#3A3A3D; color:#E0E0E0; }
#bar button.lg.on { background:#7B2CBF; color:#fff; }
#main { padding: 4px 14px 10px; display: flex; flex-direction: column; gap: 8px; }
.card { background: #2A2A2D; border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
.label { text-align: center; color: #A78BFA; font-size: 12px; }
.row { display: flex; gap: 6px; align-items: center; }
input[type=text], select { height: 36px; width: 100%; background: #202020; color: #E0E0E0; border: 1px solid #575757; border-radius: 5px; padding: 0 10px; font-size: 13px; font-family: var(--f); outline: none; user-select: text; -webkit-user-select: text; }
input[type=text]:focus, select:focus { border-color: #7B2CBF; }
.sel { position: relative; flex: 1; min-width: 0; }
.sel select { appearance: none; -webkit-appearance: none; padding-right: 36px; cursor: pointer; text-overflow: ellipsis; }
.sel::after { content: "\25BE"; position: absolute; right: 4px; top: 4px; width: 28px; height: 28px; line-height: 28px; text-align: center; background: #7B2CBF; color: #fff; border-radius: 5px; pointer-events: none; }
button.b { height: 36px; border: 0; border-radius: 5px; background: #7B2CBF; color: #fff; font-size: 13px; font-weight: bold; font-family: var(--f); cursor: pointer; padding: 0 10px; }
button.b:hover { background: #9D4EDD; }
button.b:active { background: #5A189A; }
button.b.danger { background: #B83232; }
button.b.danger:hover { background: #D04040; }
button.b.warn { background: #D4A94A; color: #202020; }
button.b.warn:hover { filter: brightness(1.1); }
button.b.sq { width: 36px; padding: 0; flex: none; }
button.b.wide { flex: none; }
button.b:disabled { background: #575757; color: #8A8A8A; cursor: default; }
button.main { width: 100%; height: 44px; font-size: 14px; }
#list { height: 64px; overflow-y: auto; background: #202020; border: 1px solid #575757; border-radius: 5px; padding: 2px; }
#list::-webkit-scrollbar { width: 8px; }
#list::-webkit-scrollbar-thumb { background: #575757; border-radius: 4px; }
.item { height: 24px; display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 0 4px 0 6px; }
.item span { color: #8A8A8A; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item button { width: 20px; height: 20px; flex: none; border: 0; border-radius: 5px; background: #B83232; color: #fff; font-size: 12px; font-weight: bold; font-family: var(--f); cursor: pointer; line-height: 20px; }
.item button:hover { background: #D04040; }
.empty { color: #8A8A8A; text-align: center; line-height: 56px; font-size: 12px; }
.check { display: flex; align-items: center; gap: 10px; cursor: pointer; height: 24px; }
.check input { appearance: none; -webkit-appearance: none; width: 20px; height: 20px; border-radius: 5px; background: #202020; border: 1px solid #575757; position: relative; cursor: pointer; flex: none; }
.check input:checked { background: #7B2CBF; border-color: #7B2CBF; }
.check input:checked::after { content: ""; position: absolute; left: 6px; top: 2px; width: 5px; height: 10px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg); }
.muted { color: #8A8A8A; }
.val { color: #D4A94A; font-weight: bold; font-size: 14px; }
.between { display: flex; justify-content: space-between; align-items: center; }
input[type=range] { appearance: none; -webkit-appearance: none; width: 100%; height: 6px; border-radius: 3px; background: #575757; outline: none; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 5px; background: #7B2CBF; cursor: pointer; }
input[type=range]::-webkit-slider-thumb:hover { background: #9D4EDD; }
#foot { text-align: center; color: #8A8A8A; font-size: 12px; }
#foot span { color: #A78BFA; }
#foot .beta { color: #D4A94A; font-weight: bold; }
.hidden { display: none !important; }
#dupNote:empty { display: none; }
#bar button.lg { font-family: Tahoma, "Segoe UI", sans-serif; }
#lgFa { font-family: 'AC-FA', Tahoma, 'Segoe UI', sans-serif; }
#lgEn { font-family: 'AC-EN', Consolas, 'Segoe UI', monospace; }
body.fa .sel { direction: ltr; }
body.fa .sel select { direction: rtl; text-align: right; }
body.fa input[type=range] { direction: ltr; }
body.fa #url { direction: ltr; text-align: left; }
body.fa #dlgInput, body.fa #renameInput { text-align: right; }
body.fa #foot { direction: rtl; }
#cols { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: stretch; }
.col { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
#colL .card:last-child { flex: 1; }
#colL .card:last-child #list { flex: 1; min-height: 64px; height: auto; }
#colR .card:first-child { flex: 1; justify-content: space-between; }
</style>
</head>
<body>
<div id="bar">
  <div id="drag">AllChats</div>
  <button class="lg" id="lgFa">فارسی</button>
  <button class="lg" id="lgEn">English</button>
  <button id="min">&#8211;</button>
  <button id="close">&#10005;</button>
</div>
<div id="main">
<div id="cols">
<div class="col" id="colL">
  <div class="card">
    <div class="label" data-i="profile">PROFILE</div>
    <div class="row" id="profileRow">
      <div class="sel"><select id="profile"></select></div>
      <button class="b sq" id="add" data-i-title="profile.new" title="New profile">+</button>
      <button class="b sq" id="dup">⧉</button>
      <button class="b sq danger" id="del" data-i-title="profile.delete" title="Delete profile">&#8211;</button>
    </div>
    <div class="muted" id="dupNote"></div>
    <div class="row" id="actionRow">
      <button class="b" id="save" data-i="save" style="flex:1">Save</button>
      <button class="b" id="rename" data-i="rename" style="flex:1">Rename</button>
    </div>
    <div class="row hidden" id="renameRow">
      <input type="text" id="renameInput" spellcheck="false">
      <button class="b wide" id="renameOk" data-i="ok">OK</button>
      <button class="b wide danger" id="renameCancel" data-i="cancel">Cancel</button>
    </div>
  </div>
  <div class="card">
    <div class="label" data-i="page">PAGE</div>
    <input type="text" id="url" spellcheck="false" data-i-ph="page.ph" placeholder="https://...">
    <button class="b" id="preview">Preview</button>
  </div>
  <div class="card">
    <div class="label" data-i="bg">BACKGROUNDS</div>
    <div class="row">
      <div class="sel"><select id="cands"></select></div>
      <button class="b sq" id="rescan" data-i-title="bg.rescan" title="Rescan page">&#8635;</button>
    </div>
    <div id="list"></div>
  </div>
</div>
<div class="col" id="colR">
  <div class="card">
    <div class="label" data-i="overlay">OVERLAY</div>
    <label class="check"><input type="checkbox" id="seven"><span data-i="opt.seven">7TV emotes</span></label>
    <label class="check"><input type="checkbox" id="conn"><span data-i="opt.conn">Connection checker</span></label>
    <label class="check"><input type="checkbox" id="border"><span data-i="opt.border">Hide border (click-through)</span></label>
    <label class="check"><input type="checkbox" id="autobg"><span data-i="opt.autobg">Auto clear backgrounds and scrollbars</span></label>
    <div class="between"><span class="muted" data-i="opacity">Background opacity</span><span class="val" id="opVal">0%</span></div>
    <input type="range" id="op" min="0" max="100" value="0">
    <div class="between"><span class="muted" data-i="zoom">Zoom</span><span class="val" id="zmVal">100%</span></div>
    <input type="range" id="zm" min="50" max="200" step="5" value="100">
    <div class="between"><span class="muted" id="fdLbl" data-i="fade">Message fade timer</span><span class="val" id="fdVal">Off</span></div>
    <input type="range" id="fd" min="0" max="120" step="1" value="0">
  </div>
  <button class="b main" id="toggle">Show Overlay</button>
</div>
</div>
  <div id="foot"><span data-i="foot">Made by</span> <span>Dralder</span> v1.1.0</div>
</div>
<div id="updDialog" style="position:fixed;top:32px;left:0;right:0;bottom:0;background:rgba(32,32,32,0.88);display:none;align-items:center;justify-content:center;z-index:9999">
  <div style="background:#2A2A2D;border:1px solid #575757;border-radius:10px;padding:16px;width:300px;color:#E0E0E0;text-align:center">
    <div id="updHead" style="color:#A78BFA;font-size:12px;margin-bottom:8px">UPDATE AVAILABLE</div>
    <div id="updMsg" style="margin-bottom:12px"></div>
    <div id="updBar" style="background:#202020;border:1px solid #575757;border-radius:5px;height:14px;margin-bottom:6px;overflow:hidden;display:none">
      <div id="updBarFill" style="background:#7B2CBF;height:100%;width:0;transition:width 0.2s"></div>
    </div>
    <div id="updPct" style="color:#D4A94A;font-weight:bold;font-size:14px;margin-bottom:12px;display:none"></div>
    <div id="updBtns" style="display:flex;gap:6px"></div>
  </div>
</div>
<div id="dlg" style="position:fixed;top:32px;left:0;right:0;bottom:0;background:rgba(32,32,32,0.88);display:none;align-items:center;justify-content:center;z-index:10000">
<div style="background:#2A2A2D;border:1px solid #575757;border-radius:10px;padding:16px;width:300px;color:#E0E0E0;text-align:center">
<div id="dlgTitle" style="color:#A78BFA;font-size:12px;margin-bottom:8px"></div>
<div id="dlgMsg" style="margin-bottom:12px;word-break:break-word"></div>
<input type="text" id="dlgInput" spellcheck="false" maxlength="40" style="margin-bottom:6px">
<div id="dlgErr" style="color:#D04040;font-size:12px;min-height:16px;margin-bottom:8px"></div>
<div style="display:flex;gap:6px">
<button class="b" id="dlgOk" style="flex:1"></button>
<button class="b" id="dlgCancel" data-i="cancel" style="flex:1;background:#575757">Cancel</button>
</div>
</div>
</div>
<div id="langPick" style="position:fixed;top:32px;left:0;right:0;bottom:0;background:rgba(32,32,32,0.97);display:none;align-items:center;justify-content:center;z-index:20000"><div style="background:#2A2A2D;border:1px solid #575757;border-radius:10px;padding:20px;width:300px;color:#E0E0E0;text-align:center"><div style="color:#A78BFA;font-size:15px;margin-bottom:16px;direction:rtl;font-family:'AC-FA',Tahoma,'Segoe UI',sans-serif">زبان برنامه را انتخاب کنید</div><div style="display:flex;gap:8px"><button class="b" id="pickFa" style="flex:1;height:44px;font-family:'AC-FA',Tahoma,'Segoe UI',sans-serif">فارسی</button><button class="b" id="pickEn" style="flex:1;height:44px;font-family:'AC-EN',Consolas,'Segoe UI',monospace">English</button></div></div></div>
<script>
var $ = function (id) { return document.getElementById(id); };
var state = { overlay: false, preview: false, bgs: [], cands: [], profiles: [], lang: '' };
var shownTag = null;
var updState = 'ask';
var dlgCb = null;
var dupTimer = null;
var T = {};
function t(k, v) { var s = T[k]; if (s === undefined) return k; if (v) { for (var x in v) s = s.split('{' + x + '}').join(v[x]); } return s; }
function applyLang() {
  document.querySelectorAll('[data-i]').forEach(function (el) { el.textContent = t(el.getAttribute('data-i')); });
  document.querySelectorAll('[data-i-title]').forEach(function (el) { el.title = t(el.getAttribute('data-i-title')); });
  document.querySelectorAll('[data-i-ph]').forEach(function (el) { el.placeholder = t(el.getAttribute('data-i-ph')); });
}
window.setLang = function (code, dict) {
  T = dict;
  document.documentElement.dir = code === 'fa' ? 'rtl' : 'ltr';
  document.body.classList.toggle('fa', code === 'fa');
  applyLang();
  $('lgFa').classList.toggle('on', code === 'fa');
  $('lgEn').classList.toggle('on', code === 'en');
  if (state.profiles && state.profiles.length) window.setState(state);
  if (updState !== 'ask') { showUpdate(updState); }
};
function dlgClose() {
$('dlg').style.display = 'none';
dlgCb = null;
}
function dlgOpen(o) {
$('dlgTitle').textContent = o.title;
$('dlgMsg').textContent = o.msg || '';
$('dlgMsg').style.display = o.msg ? 'block' : 'none';
var inp = $('dlgInput');
inp.style.display = o.input ? 'block' : 'none';
inp.value = o.def || '';
$('dlgErr').textContent = '';
var ok = $('dlgOk');
ok.textContent = o.ok;
ok.className = o.danger ? 'b danger' : 'b';
dlgCb = o.cb;
$('dlg').style.display = 'flex';
if (o.input) {
inp.focus();
inp.select();
}
}
function dlgSubmit() {
var cb = dlgCb;
if (!cb) return;
var inp = $('dlgInput');
if (inp.style.display === 'none') {
dlgClose();
cb();
return;
}
var n = inp.value.trim();
var low = n.toLowerCase();
if (!n) {
$('dlgErr').textContent = t('dlg.err.empty');
return;
}
if (state.profiles.some(function (p) { return p.toLowerCase() === low; })) {
$('dlgErr').textContent = t('dlg.err.used');
return;
}
dlgClose();
cb(n);
}
$('dlgOk').onclick = dlgSubmit;
$('dlgCancel').onclick = dlgClose;
$('dlg').addEventListener('mousedown', function (e) { if (e.target === this) dlgClose(); });
document.addEventListener('keydown', function (e) {
if ($('langPick').style.display === 'flex') return;
if ($('dlg').style.display !== 'flex') return;
if (e.key === 'Enter') { e.preventDefault(); dlgSubmit(); }
if (e.key === 'Escape') { e.preventDefault(); dlgClose(); }
});

function send(o) { window.ipc.postMessage(JSON.stringify(o)); }

function formatBytes(b) {
  if (b < 1024 * 1024) return (b / 1024).toFixed(1) + ' KB';
  return (b / (1024 * 1024)).toFixed(1) + ' MB';
}

function showUpdate(s) {
  updState = s;
  var dlg = $('updDialog');
  var msg = $('updMsg');
  var bar = $('updBar');
  var pct = $('updPct');
  var btns = $('updBtns');
  var head = $('updHead');
  
  btns.innerHTML = '';
  msg.textContent = '';
  bar.style.display = 'none';
  pct.style.display = 'none';
  head.style.display = 'block';
  
  if (s === 'ask') {
    head.textContent = t('upd.head');
    var tag = state.update ? state.update.tag : '';
    var parts = t('upd.ask', {tag: ''}).split('{tag}');
    msg.textContent = '';
    msg.appendChild(document.createTextNode(parts[0]));
    var strong = document.createElement('strong');
    strong.style.cssText = 'font-size:14px;color:#D4A94A';
    strong.textContent = tag;
    msg.appendChild(strong);
    if (parts[1]) msg.appendChild(document.createTextNode(parts[1]));
    var btn1 = document.createElement('button');
    btn1.className = 'b';
    btn1.style.cssText = 'height:36px;flex:1';
    btn1.textContent = (state.update && state.update.asset) ? t('upd.now') : t('upd.page');
    btn1.onclick = function () {
      if (state.update && state.update.asset) {
        send({ cmd: 'update_now' });
        showUpdate('downloading');
      } else {
        send({ cmd: 'open_update' });
      }
    };
    var btn2 = document.createElement('button');
    btn2.className = 'b';
    btn2.style.cssText = 'height:36px;flex:1;background:#575757;color:#E0E0E0';
    btn2.textContent = t('upd.later');
    btn2.onmouseover = function () { this.style.background = '#6a6a6a'; };
    btn2.onmouseout = function () { this.style.background = '#575757'; };
    btn2.onclick = function () { dlg.style.display = 'none'; };
    btns.appendChild(btn1);
    btns.appendChild(btn2);
    dlg.style.display = 'flex';
  } else if (s === 'downloading') {
    head.textContent = t('upd.dl.head');
    msg.textContent = t('upd.dl');
    bar.style.display = 'block';
    pct.style.display = 'block';
    pct.textContent = '0%';
    var btn = document.createElement('button');
    btn.className = 'b';
    btn.style.cssText = 'height:36px;background:#575757;color:#E0E0E0';
    btn.textContent = t('cancel');
    btn.onmouseover = function () { this.style.background = '#6a6a6a'; };
    btn.onmouseout = function () { this.style.background = '#575757'; };
    btn.onclick = function () { send({ cmd: 'cancel_update' }); };
    btns.appendChild(btn);
    dlg.style.display = 'flex';
  } else if (s === 'installing') {
    head.textContent = t('upd.inst.head');
    msg.textContent = t('upd.inst');
    dlg.style.display = 'flex';
  } else if (s === 'error') {
    head.textContent = t('upd.err.head');
    head.style.color = '#D04040';
    var btn1 = document.createElement('button');
    btn1.className = 'b';
    btn1.style.cssText = 'height:36px;flex:1';
    btn1.textContent = t('upd.page');
    btn1.onclick = function () { send({ cmd: 'open_update' }); };
    var btn2 = document.createElement('button');
    btn2.className = 'b';
    btn2.style.cssText = 'height:36px;flex:1;background:#575757;color:#E0E0E0';
    btn2.textContent = t('upd.close');
    btn2.onmouseover = function () { this.style.background = '#6a6a6a'; };
    btn2.onmouseout = function () { this.style.background = '#575757'; };
    btn2.onclick = function () { dlg.style.display = 'none'; };
    btns.appendChild(btn1);
    btns.appendChild(btn2);
    dlg.style.display = 'flex';
  } else if (s === 'debug_done') {
    head.textContent = t('upd.debug.head');
    msg.textContent = t('upd.debug');
    var btn = document.createElement('button');
    btn.className = 'b';
    btn.style.cssText = 'height:36px';
    btn.textContent = t('upd.close');
    btn.onclick = function () { dlg.style.display = 'none'; };
    btns.appendChild(btn);
    dlg.style.display = 'flex';
  }
}

window.setProgress = function (o) {
  if (o.state === 'downloading') {
    showUpdate('downloading');
    var bar = $('updBarFill');
    var pct = $('updPct');
    var done = o.done || 0;
    var total = o.total || 0;
    var p = total > 0 ? Math.floor((done / total) * 100) : 0;
    bar.style.width = p + '%';
    if (total > 0) {
      pct.textContent = p + '%  ' + formatBytes(done) + ' / ' + formatBytes(total);
    } else {
      pct.textContent = formatBytes(done);
    }
  } else if (o.state === 'installing') {
    showUpdate('installing');
  } else if (o.state === 'error') {
    updState = 'error';
    var msg = $('updMsg');
    msg.style.color = '#D04040';
    var m = o.msg || '';
    var head = m.split(':')[0].trim();
    var rest = m.indexOf(':') >= 0 ? m.slice(m.indexOf(':')) : '';
    msg.textContent = T['err.' + head] !== undefined ? T['err.' + head] + rest : (m || t('upd.err.default'));
    showUpdate('error');
  } else if (o.state === 'debug_done') {
    showUpdate('debug_done');
  } else if (o.state === 'ask') {
    showUpdate('ask');
  }
};

$('updDialog').onclick = function (e) {
  if (e.target === this && (updState === 'ask' || updState === 'error' || updState === 'debug_done')) {
    this.style.display = 'none';
  }
};

document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && (updState === 'ask' || updState === 'error' || updState === 'debug_done')) {
    $('updDialog').style.display = 'none';
  }
});

function renderList() {
  var box = $('list');
  box.innerHTML = '';
  if (!state.bgs.length) {
    var e = document.createElement('div');
    e.className = 'empty';
    e.textContent = t('bg.none');
    box.appendChild(e);
    return;
  }
  state.bgs.forEach(function (name, i) {
    var row = document.createElement('div');
    row.className = 'item';
    var s = document.createElement('span');
    s.textContent = name;
    s.title = name;
    var b = document.createElement('button');
    b.textContent = '×';
    b.onclick = function () { send({ cmd: 'remove', index: i }); };
    row.appendChild(s);
    row.appendChild(b);
    box.appendChild(row);
  });
}

function renderCands() {
  var sel = $('cands');
  if (document.activeElement === sel) return;
  sel.innerHTML = '';
  var first = document.createElement('option');
  first.value = '';
  first.textContent = state.cands.length ? t('bg.select', {n: state.cands.length}) : t('bg.nocand');
  sel.appendChild(first);
  state.cands.forEach(function (name, i) {
    var o = document.createElement('option');
    o.value = String(i);
    o.textContent = name;
    sel.appendChild(o);
  });
  sel.value = '';
}

window.setState = function (s) {
  state = s;
  $('langPick').style.display = s.lang ? 'none' : 'flex';
  var drag = $('drag');
  drag.textContent = 'AllChats';
  if (s.update) {
    if (s.update.tag !== shownTag) {
      shownTag = s.update.tag;
      showUpdate('ask');
    }
  }
  var sel = $('profile');
  sel.innerHTML = '';
  s.profiles.forEach(function (n) {
    var o = document.createElement('option');
    o.value = n;
    o.textContent = n;
    if (n === s.current) o.selected = true;
    sel.appendChild(o);
  });
  if (document.activeElement !== $('url')) $('url').value = s.url;
  $('border').checked = s.hide_border;
  $('autobg').checked = s.auto_bg;
  $('seven').checked = s.seven_tv;
  $('conn').checked = s.conn_check;
  if (document.activeElement !== $('op')) {
    $('op').value = Math.round(s.opacity * 100);
    $('opVal').textContent = Math.round(s.opacity * 100) + '%';
  }
  if (document.activeElement !== $('zm')) {
    $('zm').value = Math.round(s.zoom * 100);
    $('zmVal').textContent = Math.round(s.zoom * 100) + '%';
  }
  if (document.activeElement !== $('fd')) {
    $('fd').value = s.fade_secs;
  }
  $('fdVal').textContent = s.fade_secs === 0 ? t('off') : t('sec', {n: s.fade_secs});
  renderList();
  renderCands();
  var p = $('preview');
  p.textContent = s.preview ? t('preview.hide') : t('preview.show');
  p.className = s.preview ? 'b warn' : 'b';
  var tog = $('toggle');
  tog.textContent = s.overlay ? t('overlay.stop') : t('overlay.start');
  tog.className = s.overlay ? 'b main danger' : 'b main';
  $('del').disabled = s.profiles.length < 2;
  $('dup').title = t('profile.dup') + ': ' + s.current;
};

$('drag').addEventListener('mousedown', function (e) { if (e.button === 0) send({ cmd: 'drag' }); });
$('min').onclick = function () { send({ cmd: 'min' }); };
$('close').onclick = function () { send({ cmd: 'close' }); };
$('lgFa').onclick = function () { send({ cmd: 'lang', lang: 'fa' }); };
$('lgEn').onclick = function () { send({ cmd: 'lang', lang: 'en' }); };
$('pickFa').onclick = function () { send({ cmd: 'lang', lang: 'fa' }); };
$('pickEn').onclick = function () { send({ cmd: 'lang', lang: 'en' }); };
$('profile').onchange = function () { send({ cmd: 'select', name: this.value }); };
$('add').onclick = function () {
dlgOpen({
title: t('dlg.new.title'),
msg: t('dlg.new.msg'),
input: true,
def: '',
ok: t('dlg.new.ok'),
cb: function (n) { send({ cmd: 'new', name: n }); }
});
};
$('dup').onclick = function () {
var from = state.current;
dlgOpen({
title: t('dlg.dup.title'),
msg: t('dlg.dup.msg', { name: from }),
input: true,
def: from + ' (copy)',
ok: t('dlg.dup.ok'),
cb: function (n) {
send({ cmd: 'dup', name: n });
$('dupNote').textContent = t('dup.note', { from: from, to: n });
if (dupTimer) clearTimeout(dupTimer);
dupTimer = setTimeout(function () { dupTimer = null; $('dupNote').textContent = ''; }, 5000);
}
});
};
$('save').onclick = function () { send({ cmd: 'save' }); };

$('del').onclick = function () {
var name = state.current;
dlgOpen({
title: t('dlg.del.title'),
msg: t('dlg.del.msg', {name: name}),
input: false,
ok: t('dlg.del.ok'),
danger: true,
cb: function () { send({ cmd: 'delete' }); }
});
};

function renameMode(on) {
  $('profileRow').classList.toggle('hidden', on);
  $('actionRow').classList.toggle('hidden', on);
  $('renameRow').classList.toggle('hidden', !on);
  if (on) {
    $('renameInput').value = state.current || '';
    $('renameInput').focus();
    $('renameInput').select();
  }
}
$('rename').onclick = function () { renameMode(true); };
$('renameCancel').onclick = function () { renameMode(false); };
$('renameOk').onclick = function () {
  send({ cmd: 'rename', name: $('renameInput').value });
  renameMode(false);
};
$('renameInput').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') $('renameOk').onclick();
  if (e.key === 'Escape') renameMode(false);
});

function sendUrl() { send({ cmd: 'set', url: $('url').value }); }
$('url').addEventListener('change', sendUrl);
$('url').addEventListener('keydown', function (e) { if (e.key === 'Enter') { sendUrl(); this.blur(); } });

$('preview').onclick = function () {
  if (!state.preview) send({ cmd: 'set', url: $('url').value });
  send({ cmd: 'preview' });
};

$('cands').addEventListener('mousedown', function () { send({ cmd: 'scan' }); });
$('cands').onchange = function () {
  if (this.value !== '') send({ cmd: 'add_bg', index: parseInt(this.value, 10) });
  this.blur();
};
$('cands').addEventListener('blur', renderCands);
$('rescan').onclick = function () { send({ cmd: 'scan' }); };

$('border').onchange = function () { send({ cmd: 'set', hide_border: this.checked }); };
$('autobg').onchange = function () { send({ cmd: 'set', auto_bg: this.checked }); };
$('seven').onchange = function () { send({ cmd: 'set', seven_tv: this.checked }); };
$('conn').onchange = function () { send({ cmd: 'set', conn_check: this.checked }); };

$('op').addEventListener('input', function () {
  $('opVal').textContent = this.value + '%';
  send({ cmd: 'set', opacity: this.value / 100, commit: false });
});
$('op').addEventListener('change', function () {
  send({ cmd: 'set', opacity: this.value / 100, commit: true });
});

$('zm').addEventListener('input', function () {
  $('zmVal').textContent = this.value + '%';
  send({ cmd: 'set', zoom: this.value / 100, commit: false });
});
$('zm').addEventListener('change', function () {
  send({ cmd: 'set', zoom: this.value / 100, commit: true });
});

$('fd').addEventListener('input', function () {
  $('fdVal').textContent = this.value === '0' ? t('off') : t('sec', {n: this.value});
  send({ cmd: 'set', fade_secs: parseInt(this.value, 10), commit: false });
});
$('fd').addEventListener('change', function () {
  send({ cmd: 'set', fade_secs: parseInt(this.value, 10), commit: true });
});

$('toggle').onclick = function () {
  if (!state.overlay) send({ cmd: 'set', url: $('url').value });
  send({ cmd: state.overlay ? 'stop' : 'start' });
};

document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
send({ cmd: 'init' });
</script>
</body>
</html>
